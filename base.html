<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Semington Skittles & Transport Hub{% endblock %}</title>
  
  <!-- Link to your unified stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- SITE-WIDE HEADER & NAVIGATION -->
  <header>
    <h1>Semington Skittles & Transport Hub</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/fixtures">Fixtures & Results</a>
      <a href="/scoreboard">Scoreboard</a>
      <a href="/match-results">Match Results</a>
      <a href="/to-catch">To Catch</a>
      <a href="/gallery">Gallery</a>
      <a href="/rules">Rules</a>
    </nav>
  </header>

  <!-- DYNAMIC PAGE CONTENT CONTAINER -->
  <main>
    {% block content %}
    <!-- Individual page contents get injected here -->
    {% endblock %}
  </main>

  <!-- OPTIONAL JAVASCRIPT BLOCK FOR PAGE-SPECIFIC SCRIPTS -->
  {% block scripts %}{% endblock %}

</body>
</html>
