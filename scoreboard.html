<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard - Semington A Skittles Team</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    /* Navigation Bar */
    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      background-color: #5a6268;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .btn.active, .btn:hover {
      background-color: #343a40;
    }

    /* Scoreboard Container */
    .scoreboard-board {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border: 4px solid #222;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Venue Title Header - Side-by-side layout */
    .venue-header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 20px 15px;
      margin-bottom: 20px;
      border-bottom: 2px solid #222;
      gap: 15px;
    }

    .venue-header h2 {
      margin: 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Team Control Box */
    .team-control-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score-up-label {
      font-weight: bold;
      font-size: 14px;
    }

    /* Stacked container for Division and Venue in the middle */
    .central-meta-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      max-width: 280px;
      align-items: center;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      width: 100%;
    }

    .team-select, .meta-select {
      font-size: 1.05rem;
      font-weight: bold;
      padding: 6px 10px;
      border: 2px solid #333;
      border-radius: 4px;
      background-color: #fff;
      cursor: pointer;
    }

    .overall-score {
      font-size: 1.3rem;
      font-weight: bold;
      background: #e9ecef;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid #bbb;
    }

    /* Side-by-side Tables */
    .teams-grid {
      display: flex;
      gap: 15px;
      overflow-x: auto;
    }

    .team-column {
      flex: 1;
      min-width: 480px;
    }

    .skittles-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .skittles-table th, .skittles-table td {
      border: 1px solid #333;
      padding: 6px;
      vertical-align: middle;
    }

    .skittles-table th {
      background-color: #e2e8f0;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .skittles-table th.team-header {
      background-color: #2b3a4a;
      color: white;
      font-size: 1.1rem;
    }

    .player-name-input {
      width: 90%;
      border: none;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .score-input {
      width: 32px;
      text-align: center;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 3px;
    }

    .total-cell {
      font-weight: bold;
      background-color: #f8f9fa;
      font-size: 1rem;
    }

    .leg-result-row td {
      font-weight: bold;
      background-color: #eaeff2;
      font-size: 1rem;
    }

    .totals-row td {
      font-weight: bold;
      background-color: #d1ecf1;
      font-size: 1.05rem;
    }

    /* Spare Styling: Diamond / Corner mark box effect */
    .score-input.spare-box {
      background-color: #fffde7; /* Subtle light highlight */
      border: 2px solid #000 !important;
      box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #000;
      font-weight: bold;
    }
    
    /* Footer summary row styling */
    .legs-won-row, .match-points-row {
      background-color: #f0f4f8;
      font-weight: bold;
    }
    
    .match-points-row td {
      font-size: 1.05rem;
      color: #1a365d;
    }

    /* Ensure table columns expand comfortably */
    .scoreboard-table th, 
    .scoreboard-table td {
      padding: 4px 6px;
      text-align: center;
    }
    
    /* Set explicit width and padding for leg score inputs */
    .score-input {
      width: 65px !important;       /* Increases width to fit double figures */
      height: 34px;                 /* Adds height for balanced box dimensions */
      font-size: 1.1rem;            /* Clear, readable score font */
      font-weight: bold;
      text-align: center;
      padding: 0 4px;
      border: 1px solid #999;
      border-radius: 4px;
      box-sizing: border-box;       /* Keeps borders within width calculation */
    }
    
    /* Maintain proper sizing when spare-box class is applied */
    .score-input.spare-box {
      width: 65px !important;
      box-sizing: border-box;
    }

    /* Give the Name column specific minimum and flexible width */
    .scoreboard-table th:first-child,
    .scoreboard-table td:first-child {
      min-width: 150px; /* Widens the entire Name column */
      width: 170px;
    }
    
    /* Make the player name input boxes fill the wider cell */
    .player-name-input {
      width: 100% !important;
      font-size: 1rem;
      padding: 6px 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Semington A Skittles Club</h1>
  </header>

  <!-- Navigation Menu -->
  <nav class="nav-buttons">
    <a href="index.html" class="btn">Home</a>
    <a href="fixtures.html" class="btn">Fixtures & Results</a>
    <a href="scoreboard.html" class="btn active">Scoreboard</a>
    <a href="results.html" class="btn">Match Results</a>
    <a href="tocatch.html" class="btn">To Catch</a>
    <a href="gallery.html" class="btn">Gallery</a>
    <a href="rules.html" class="btn">Rules</a>
  </nav>

  <!-- Traditional Skittles Scoreboard -->
  <div class="scoreboard-board">
  
    <!-- Header Section Matching Spreadsheet Grid -->
    <div class="venue-header">
  
      <!-- LEFT: HOME TEAM CONTROL -->
      <div class="team-control-box">
        <div class="control-row">
          <label for="home-team-select"><strong>HOME TEAM</strong></label>
        </div>
        <div class="control-row">
          <select class="team-select" id="home-team-select">
            <option value="STAVERTON A">STAVERTON A</option>
          </select>
        </div>
        <div class="control-row">
          <span class="score-up-label">UP</span>
          <span class="overall-score" id="home-grand-total">0</span>
        </div>
      </div>
  
      <!-- CENTER: DIVISION & VENUE (STACKED VERTICALLY) -->
      <div class="central-meta-box">
        <div class="meta-row">
          <label for="division-select"><strong>Division</strong></label>
          <select class="meta-select" id="division-select" onchange="updateDivisionTeams()">
            <option value="premier" selected>PREMIER</option>
            <option value="div1">DIVISION 1</option>
            <option value="cup">CUP MATCH</option>
          </select>
        </div>
  
        <div class="meta-row">
          <label for="venue-select"><strong>Venue</strong></label>
          <select class="meta-select" id="venue-select">
            <option value="LIBERAL CLUB" selected>LIBERAL CLUB</option>
            <option value="SEMINGTON VILLAGE HALL">SEMINGTON VILLAGE HALL</option>
            <option value="STAVERTON CLUB">STAVERTON CLUB</option>
            <option value="SEEND COMMUNITY CENTRE">SEEND COMMUNITY CENTRE</option>
            <option value="SPENCERS CLUB">SPENCERS CLUB</option>
            <option value="CONSERVATIVE CLUB">CONSERVATIVE CLUB</option>
            <option value="THE PILOT INN">THE PILOT INN</option>
            <option value="FOREST COMMUNITY CENTRE">FOREST COMMUNITY CENTRE</option>
          </select>
        </div>
      </div>
  
      <!-- RIGHT: AWAY TEAM CONTROL -->
      <div class="team-control-box">
        <div class="control-row">
          <label for="away-team-select"><strong>AWAY TEAM</strong></label>
        </div>
        <div class="control-row">
          <select class="team-select" id="away-team-select">
            <option value="SEMINGTON A">SEMINGTON A</option>
          </select>
        </div>
        <div class="control-row">
          <span class="score-up-label">UP</span>
          <span class="overall-score" id="away-grand-total">0</span>
        </div>
      </div>
  
    </div>
  
    <!-- Tables Grid -->
    <div class="teams-grid">
      
      <!-- HOME TABLE -->
      <div class="team-column">
        <table class="skittles-table" id="home-table">
          <thead>
            <tr>
              <th colspan="7" class="team-header" id="home-header-display">STAVERTON A</th>
            </tr>
            <tr>
              <th>NAME</th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              <th>TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <script>
              for(let i=1; i<=10; i++){
                document.write(`
                  <tr class="player-row">
                    <td><input type="text" class="player-name-input" placeholder="Player ${i}"></td>
                    ${[1,2,3,4,5].map(leg => `<td><input type="number" class="score-input leg-${leg}" min="0" max="27" oninput="calculateScores()"></td>`).join('')}
                    <td class="total-cell player-total">0</td>
                  </tr>
                `);
              }
            </script>
          </tbody>
          <tfoot>
            <tr class="totals-row">
              <td>TOTALS</td>
              <td id="home-leg-1">0</td>
              <td id="home-leg-2">0</td>
              <td id="home-leg-3">0</td>
              <td id="home-leg-4">0</td>
              <td id="home-leg-5">0</td>
              <td id="home-total-sum">0</td>
            </tr>
            <tr class="legs-won-row">
              <td>LEGS WON</td>
              <td id="home-leg-res-1">-</td>
              <td id="home-leg-res-2">-</td>
              <td id="home-leg-res-3">-</td>
              <td id="home-leg-res-4">-</td>
              <td id="home-leg-res-5">-</td>
              <td id="home-legs-won-total">0 (0 pts)</td>
            </tr>
          </tfoot>
        </table>
      </div>
  
      <!-- AWAY TABLE -->
      <div class="team-column">
        <table class="skittles-table" id="away-table">
          <thead>
            <tr>
              <th colspan="7" class="team-header" id="away-header-display">VISITORS</th>
            </tr>
            <tr>
              <th>NAME</th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              <th>TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <script>
              for(let i=1; i<=10; i++){
                document.write(`
                  <tr class="player-row">
                    <td><input type="text" class="player-name-input" placeholder="Player ${i}"></td>
                    ${[1,2,3,4,5].map(leg => `<td><input type="number" class="score-input leg-${leg}" min="0" max="27" oninput="calculateScores()"></td>`).join('')}
                    <td class="total-cell player-total">0</td>
                  </tr>
                `);
              }
            </script>
          </tbody>
          <tfoot>
            <tr class="totals-row">
              <td>TOTALS</td>
              <td id="away-leg-1">0</td>
              <td id="away-leg-2">0</td>
              <td id="away-leg-3">0</td>
              <td id="away-leg-4">0</td>
              <td id="away-leg-5">0</td>
              <td id="away-total-sum">0</td>
            </tr>
            <tr class="legs-won-row">
              <td>LEGS WON</td>
              <td id="away-leg-res-1">-</td>
              <td id="away-leg-res-2">-</td>
              <td id="away-leg-res-3">-</td>
              <td id="away-leg-res-4">-</td>
              <td id="away-leg-res-5">-</td>
              <td id="away-legs-won-total">0 (0 pts)</td>
            </tr>
          </tfoot>
        </table>
      </div>

    </div>
  
  </div>

  <!-- Auto-calculation & Dropdown Update Logic -->
    <script>
      const premierTeams = [
        "Staverton A",
        "Seend A",
        "Seend B",
        "MUDS",
        "Comrades",
        "Semington A",
        "Semington B",
        "Motley Crew",
        "Drifters",
        "GBU",
        "Melksham Casuals",
        "Spencers B",
        "Avon A"
      ];
    
      const div1Teams = [
        "Staverton B",
        "Steeple Ashton",
        "Seend B",
        "Avon D",
        "The Bees",
        "Cons B",
        "Legion E",
        "Forest Rangers",
        "Melksham Rovers",
        "Saracens",
        "Cons C",
        "A Cons",
        "The Pilot"
      ];
    
      function updateDivisionTeams() {
        const divSelect = document.getElementById('division-select');
        const homeSelect = document.getElementById('home-team-select');
        const awaySelect = document.getElementById('away-team-select');
        
        if (!divSelect || !homeSelect || !awaySelect) return;
    
        let selectedList = premierTeams;
        if (divSelect.value === 'div1') {
          selectedList = div1Teams;
        } else if (divSelect.value === 'cup') {
          selectedList = [...new Set([...premierTeams, ...div1Teams])];
        }
    
        homeSelect.innerHTML = '';
        awaySelect.innerHTML = '';
    
        selectedList.forEach((team, index) => {
          let opt1 = document.createElement('option');
          opt1.value = team;
          opt1.innerText = team;
          if (index === 0) opt1.selected = true;
          homeSelect.appendChild(opt1);
    
          let opt2 = document.createElement('option');
          opt2.value = team;
          opt2.innerText = team;
          if (index === 1) opt2.selected = true;
          awaySelect.appendChild(opt2);
        });
    
        updateTeamHeaders();
        calculateScores();
      }
    
      function updateTeamHeaders() {
        const homeSelect = document.getElementById('home-team-select');
        const awaySelect = document.getElementById('away-team-select');
        
        if (homeSelect && awaySelect && homeSelect.value && awaySelect.value) {
          const homeDisp = document.getElementById('home-header-display');
          const awayDisp = document.getElementById('away-header-display');
          if (homeDisp) homeDisp.innerText = homeSelect.value.toUpperCase();
          if (awayDisp) awayDisp.innerText = awaySelect.value.toUpperCase();
        }
      }
    
      // Attach event listeners for dropdown changes
      const homeSelect = document.getElementById('home-team-select');
      const awaySelect = document.getElementById('away-team-select');
      if (homeSelect) homeSelect.addEventListener('change', updateTeamHeaders);
      if (awaySelect) awaySelect.addEventListener('change', updateTeamHeaders);
    
      function calculateScores() {
        let homeLegTotals = [0, 0, 0, 0, 0];
        let awayLegTotals = [0, 0, 0, 0, 0];
        let homeGrandTotal = 0;
        let awayGrandTotal = 0;
    
        // 1. Home Team Calculations
        let homeRows = document.querySelectorAll('#home-table .player-row');
        homeRows.forEach(row => {
          let playerTotal = 0;
          for (let leg = 1; leg <= 5; leg++) {
            let input = row.querySelector(`.leg-${leg}`);
            let val = parseInt(input.value) || 0;
    
            if (val >= 10) {
              input.classList.add('spare-box');
            } else {
              input.classList.remove('spare-box');
            }
    
            playerTotal += val;
            homeLegTotals[leg - 1] += val;
          }
          let pTotalElem = row.querySelector('.player-total');
          if (pTotalElem) pTotalElem.innerText = playerTotal;
          homeGrandTotal += playerTotal;
        });
    
        // 2. Away Team Calculations
        let awayRows = document.querySelectorAll('#away-table .player-row');
        awayRows.forEach(row => {
          let playerTotal = 0;
          for (let leg = 1; leg <= 5; leg++) {
            let input = row.querySelector(`.leg-${leg}`);
            let val = parseInt(input.value) || 0;
    
            if (val >= 10) {
              input.classList.add('spare-box');
            } else {
              input.classList.remove('spare-box');
            }
    
            playerTotal += val;
            awayLegTotals[leg - 1] += val;
          }
          let pTotalElem = row.querySelector('.player-total');
          if (pTotalElem) pTotalElem.innerText = playerTotal;
          awayGrandTotal += playerTotal;
        });
    
        // 3. Update Row 1: TOTALS (Pin Sums per Leg 1 through 5)
        for (let leg = 1; leg <= 5; leg++) {
          let hLegElem = document.getElementById(`home-leg-${leg}`);
          let aLegElem = document.getElementById(`away-leg-${leg}`);
          if (hLegElem) hLegElem.innerText = homeLegTotals[leg - 1];
          if (aLegElem) aLegElem.innerText = awayLegTotals[leg - 1];
        }
    
        // 4. Update Bottom Row: LEGS WON (I = Win, 1/2 = Draw, - = Loss/Unplayed)
        const divisionElem = document.getElementById('division-select');
        const divisionVal = divisionElem ? divisionElem.value.toLowerCase() : 'premier';
        const isCup = (divisionVal === 'cup');
    
        let homeLegsWonSum = 0;
        let awayLegsWonSum = 0;
    
        for (let leg = 1; leg <= 5; leg++) {
          let hScore = homeLegTotals[leg - 1];
          let aScore = awayLegTotals[leg - 1];
          
          let hResElem = document.getElementById(`home-leg-res-${leg}`);
          let aResElem = document.getElementById(`away-leg-res-${leg}`);
    
          if (hResElem && aResElem) {
            // Unplayed leg check (both scores zero)
            if (hScore === 0 && aScore === 0) {
              hResElem.innerText = "-";
              aResElem.innerText = "-";
            } else if (isCup) {
              // Cup matches do not award leg win points
              hResElem.innerText = "-";
              aResElem.innerText = "-";
            } else if (hScore > aScore) {
              hResElem.innerText = "I";
              aResElem.innerText = "-";
              homeLegsWonSum += 1;
            } else if (aScore > hScore) {
              hResElem.innerText = "-";
              aResElem.innerText = "I";
              awayLegsWonSum += 1;
            } else {
              hResElem.innerText = "1/2";
              aResElem.innerText = "1/2";
              homeLegsWonSum += 0.5;
              awayLegsWonSum += 0.5;
            }
          }
        }
    
        // 5. Calculate Bonus Points for Overall Pin Total (+2 points)
        let homeBonus = 0;
        let awayBonus = 0;
        if (homeGrandTotal > 0 || awayGrandTotal > 0) {
          if (homeGrandTotal > awayGrandTotal) {
            homeBonus = 2;
          } else if (awayGrandTotal > homeGrandTotal) {
            awayBonus = 2;
          } else {
            homeBonus = 1;
            awayBonus = 1;
          }
        }
    
        let homeTotalPoints = isCup ? 0 : (homeLegsWonSum + homeBonus);
        let awayTotalPoints = isCup ? 0 : (awayLegsWonSum + awayBonus);
    
        // Update Bottom Right Box (Total Legs Won & Match Points)
        let hLegsTotalElem = document.getElementById('home-legs-won-total');
        let aLegsTotalElem = document.getElementById('away-legs-won-total');
        if (hLegsTotalElem) hLegsTotalElem.innerText = isCup ? "-" : `${homeLegsWonSum} (${homeTotalPoints} pts)`;
        if (aLegsTotalElem) aLegsTotalElem.innerText = isCup ? "-" : `${awayLegsWonSum} (${awayTotalPoints} pts)`;
    
        // Update Row 1 Far Right Cell (Grand Total Pinfall)
        let hTotalSumElem = document.getElementById('home-total-sum');
        let aTotalSumElem = document.getElementById('away-total-sum');
        if (hTotalSumElem) hTotalSumElem.innerText = homeGrandTotal;
        if (aTotalSumElem) aTotalSumElem.innerText = awayGrandTotal;
    
        // 6. Top Box Difference (UP)
        let homeBox = document.getElementById('home-grand-total');
        let awayBox = document.getElementById('away-grand-total');
    
        if (homeBox && awayBox) {
          if (homeGrandTotal > awayGrandTotal) {
            homeBox.innerText = (homeGrandTotal - awayGrandTotal);
            awayBox.innerText = "0";
          } else if (awayGrandTotal > homeGrandTotal) {
            homeBox.innerText = "0";
            awayBox.innerText = (awayGrandTotal - homeGrandTotal);
          } else {
            homeBox.innerText = "0";
            awayBox.innerText = "0";
          }
        }
      }
    
      // Initialize on load
      updateDivisionTeams();
      calculateScores();
  </script>

</body>
</html>
