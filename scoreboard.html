<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard - Semington A Skittles Team</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    /* Navigation Bar */
    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      background-color: #5a6268;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .btn.active, .btn:hover {
      background-color: #343a40;
    }

    /* Scoreboard Container */
    .scoreboard-board {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      border: 4px solid #222;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Venue Title Header */
    .venue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #222;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .venue-header h2 {
      margin: 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .team-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-select {
      font-size: 1.05rem;
      font-weight: bold;
      padding: 6px 10px;
      border: 2px solid #333;
      border-radius: 4px;
      background-color: #fff;
      cursor: pointer;
    }

    .overall-score {
      font-size: 1.3rem;
      font-weight: bold;
      background: #e9ecef;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid #bbb;
    }

    /* Side-by-side Tables */
    .teams-grid {
      display: flex;
      gap: 15px;
      overflow-x: auto;
    }

    .team-column {
      flex: 1;
      min-width: 480px;
    }

    .skittles-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .skittles-table th, .skittles-table td {
      border: 1px solid #333;
      padding: 6px;
    }

    .skittles-table th {
      background-color: #e2e8f0;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .skittles-table th.team-header {
      background-color: #2b3a4a;
      color: white;
      font-size: 1.1rem;
    }

    .player-name-input {
      width: 90%;
      border: none;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .score-input {
      width: 32px;
      text-align: center;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 3px;
    }

    .total-cell {
      font-weight: bold;
      background-color: #f8f9fa;
      font-size: 1rem;
    }

    .totals-row td {
      font-weight: bold;
      background-color: #d1ecf1;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Semington A Skittles Club</h1>
  </header>

  <!-- Navigation Menu -->
  <nav class="nav-buttons">
    <a href="index.html" class="btn">Home</a>
    <a href="fixtures.html" class="btn">Fixtures & Results</a>
    <a href="scoreboard.html" class="btn active">Scoreboard</a>
    <a href="results.html" class="btn">Match Results</a>
    <a href="tocatch.html" class="btn">To Catch</a>
    <a href="gallery.html" class="btn">Gallery</a>
    <a href="rules.html" class="btn">Rules</a>
  </nav>

  <!-- Traditional Skittles Scoreboard -->
  <div class="scoreboard-board">
    
    <!-- Top Header Bar with Division, Teams & Venue Dropdowns -->
    <div class="venue-header">

      <div class="team-title-box">
        <label><strong>HOME:</strong></label>
        <select class="team-select" id="home-team-select">
          <!-- Populated dynamically via script -->
        </select>
        <span class="overall-score" id="home-grand-total">0</span>
      </div>

      <!-- Division Selector -->
<div class="format-select-box" style="margin-bottom: 10px; width: 100%; text-align: center;">
  <label><strong>DIVISION:</strong></label>
  <select class="team-select" id="division-select" onchange="updateDivisionTeams()">
    <option value="premier" selected>Premier Division</option>
    <option value="div1">Division 1</option>
    <option value="cup">Cup Match</option>
  </select>
</div>                                                                                                                

<!-- Venue Dropdown Center (All Venues) -->
<div class="venue-box">
  <select class="team-select" id="venue-select">
    <option value="Liberal Club" selected>Liberal Club</option>
    <option value="Semington Village Hall">Semington Village Hall</option>
    <option value="Staverton Club">Staverton Club</option>
    <option value="Seend Community Centre">Seend Community Centre</option>
    <option value="Spencers Club">Spencers Club</option>
    <option value="Conservative Club">Conservative Club</option>
    <option value="The Pilot Inn">The Pilot Inn</option>
    <option value="Forest Community Centre">Forest Community Centre</option>
  </select>
</div>

      <div class="team-title-box">
        <label><strong>VISITORS:</strong></label>
        <select class="team-select" id="away-team-select">
          <!-- Populated dynamically via script -->
        </select>
        <span class="overall-score" id="away-grand-total">0</span>
      </div>
    </div>

    <!-- Tables Grid -->
    <div class="teams-grid">
      
      <!-- HOME TEAM TABLE -->
      <div class="team-column">
        <table class="skittles-table" id="home-table">
          <thead>
            <tr>
              <th colspan="8" class="team-header" id="home-header-display">HOME TEAM</th>
            </tr>
            <tr>
              <th>NAME</th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              <th>TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <!-- 10 Player Rows -->
            <script>
              for(let i=1; i<=10; i++){
                document.write(`
                  <tr class="player-row">
                    <td><input type="text" class="player-name-input" placeholder="Player ${i}"></td>
                    ${[1,2,3,4,5].map(leg => `<td><input type="number" class="score-input leg-${leg}" min="0" max="27" oninput="calculateScores()"></td>`).join('')}
                    <td class="total-cell player-total">0</td>
                  </tr>
                `);
              }
            </script>
          </tbody>
          <tfoot>
            <tr class="totals-row">
              <td>TOTALS</td>
              <td id="home-leg-1">0</td>
              <td id="home-leg-2">0</td>
              <td id="home-leg-3">0</td>
              <td id="home-leg-4">0</td>
              <td id="home-leg-5">0</td>
              <td id="home-total-sum">0</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- AWAY TEAM TABLE -->
      <div class="team-column">
        <table class="skittles-table" id="away-table">
          <thead>
            <tr>
              <th colspan="8" class="team-header" id="away-header-display">VISITORS</th>
            </tr>
            <tr>
              <th>NAME</th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              <th>TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <!-- 10 Player Rows -->
            <script>
              for(let i=1; i<=10; i++){
                document.write(`
                  <tr class="player-row">
                    <td><input type="text" class="player-name-input" placeholder="Player ${i}"></td>
                    ${[1,2,3,4,5].map(leg => `<td><input type="number" class="score-input leg-${leg}" min="0" max="27" oninput="calculateScores()"></td>`).join('')}
                    <td class="total-cell player-total">0</td>
                  </tr>
                `);
              }
            </script>
          </tbody>
          <tfoot>
            <tr class="totals-row">
              <td>TOTALS</td>
              <td id="away-leg-1">0</td>
              <td id="away-leg-2">0</td>
              <td id="away-leg-3">0</td>
              <td id="away-leg-4">0</td>
              <td id="away-leg-5">0</td>
              <td id="away-total-sum">0</td>
            </tr>
          </tfoot>
        </table>
      </div>

  <!-- Auto-calculation & Dropdown Update Logic -->
  <script>
    const premierTeams = [
    "1. Staverton A",
    "2. Seend A",
    "3. Seend B",
    "4. MUDS",
    "5. Comrades",
    "6. Semington A",
    "7. Semington B",
    "8. Motley Crew",
    "9. Drifters",
    "10. GBU",
    "11. Melksham Casuals",
    "12. Spencers B",
    "13. Avon A"
  ];

  const div1Teams = [
    "1. Staverton B",
    "2. Steeple Ashton",
    "3. Seend B",
    "4. Avon D",
    "5. The Bees",
    "6. Cons B",
    "7. Legion E",
    "8. Forest Rangers",
    "9. Melksham Rovers",
    "10. Saracens",
    "11. Cons C",
    "13. A Cons",
    "14. The Pilot"
  ];

  function updateDivisionTeams() {
    const divSelect = document.getElementById('division-select');
    const homeSelect = document.getElementById('home-team-select');
    const awaySelect = document.getElementById('away-team-select');
    
    if (!divSelect || !homeSelect || !awaySelect) return;

    const selectedList = (divSelect.value === 'premier') ? premierTeams : div1Teams;

    homeSelect.innerHTML = '';
    awaySelect.innerHTML = '';

    selectedList.forEach((team, index) => {
      let opt1 = document.createElement('option');
      opt1.value = team;
      opt1.innerText = team;
      if (index === 0) opt1.selected = true;
      homeSelect.appendChild(opt1);

      let opt2 = document.createElement('option');
      opt2.value = team;
      opt2.innerText = team;
      if (index === 1) opt2.selected = true;
      awaySelect.appendChild(opt2);
    });

    updateTeamHeaders();
  }

  function updateTeamHeaders() {
    const homeSelect = document.getElementById('home-team-select');
    const awaySelect = document.getElementById('away-team-select');
    
    if (homeSelect && awaySelect && homeSelect.value && awaySelect.value) {
      document.getElementById('home-header-display').innerText = homeSelect.value.toUpperCase();
      document.getElementById('away-header-display').innerText = awaySelect.value.toUpperCase();
    }
  }

  // Attach event listeners for dropdown changes
  const homeSelect = document.getElementById('home-team-select');
  const awaySelect = document.getElementById('away-team-select');
  if (homeSelect) homeSelect.addEventListener('change', updateTeamHeaders);
  if (awaySelect) awaySelect.addEventListener('change', updateTeamHeaders);

  function calculateScores() {
    let homeLegTotals = [0, 0, 0, 0, 0];
    let awayLegTotals = [0, 0, 0, 0, 0];
    let homeGrandTotal = 0;
    let awayGrandTotal = 0;

    // Home Team Calculations
    let homeRows = document.querySelectorAll('#home-table .player-row');
    homeRows.forEach(row => {
      let playerTotal = 0;
      for (let leg = 1; leg <= 5; leg++) {
        let input = row.querySelector(`.leg-${leg}`);
        let val = parseInt(input.value) || 0;
        playerTotal += val;
        homeLegTotals[leg - 1] += val;
      }
      row.querySelector('.player-total').innerText = playerTotal;
      homeGrandTotal += playerTotal;
    });

    // Away Team Calculations
    let awayRows = document.querySelectorAll('#away-table .player-row');
    awayRows.forEach(row => {
      let playerTotal = 0;
      for (let leg = 1; leg <= 5; leg++) {
        let input = row.querySelector(`.leg-${leg}`);
        let val = parseInt(input.value) || 0;
        playerTotal += val;
        awayLegTotals[leg - 1] += val;
      }
      row.querySelector('.player-total').innerText = playerTotal;
      awayGrandTotal += playerTotal;
    });

    // Update Leg Footers (Legs 1 to 5)
    for (let leg = 1; leg <= 5; leg++) {
      document.getElementById(`home-leg-${leg}`).innerText = homeLegTotals[leg - 1];
      document.getElementById(`away-leg-${leg}`).innerText = awayLegTotals[leg - 1];
    }

    // Update Overall Pin Sums
    document.getElementById('home-total-sum').innerText = homeGrandTotal;
    document.getElementById('away-total-sum').innerText = awayGrandTotal;

    // --- TOP BOXES: OVERALL PIN DIFFERENCE (UP) ---
    let homeBox = document.getElementById('home-grand-total');
    let awayBox = document.getElementById('away-grand-total');

    if (homeBox && awayBox) {
      if (homeGrandTotal > awayGrandTotal) {
        homeBox.innerText = (homeGrandTotal - awayGrandTotal);
        awayBox.innerText = "0";
      } else if (awayGrandTotal > homeGrandTotal) {
        homeBox.innerText = "0";
        awayBox.innerText = (awayGrandTotal - homeGrandTotal);
      } else {
        homeBox.innerText = "0";
        awayBox.innerText = "0";
      }
    }
  }

  // Initialize on load
  updateDivisionTeams();
  calculateScores();
  </script>

</body>
</html>
